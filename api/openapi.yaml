openapi: "3.0.3"
info:
  title: Langy API
  version: "1.0.0"
  description: Language learning flashcard API with spaced repetition

servers:
  - url: /api

security: []

paths:
  # ── Auth (public) ──────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  # ── Images (protected) ─────────────────────────────────────────────
  /images:
    post:
      operationId: uploadImage
      tags: [images]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResponse"
        default:
          $ref: "#/components/responses/Error"

  /images/{id}:
    get:
      operationId: getImage
      tags: [images]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Image binary
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"

  # ── Languages ──────────────────────────────────────────────────────
  /language-pairs:
    get:
      operationId: listLanguagePairs
      tags: [languages]
      summary: List supported language pairs
      responses:
        "200":
          description: Supported language pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LanguagePairResponse"

  # ── Decks (protected) ──────────────────────────────────────────────
  /decks:
    get:
      operationId: listDecks
      tags: [decks]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of decks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deck"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDeck
      tags: [decks]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeckRequest"
      responses:
        "201":
          description: Deck created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        default:
          $ref: "#/components/responses/Error"

  /decks/{id}:
    delete:
      operationId: deleteDeck
      tags: [decks]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deck deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        default:
          $ref: "#/components/responses/Error"

  # ── Cards (protected) ──────────────────────────────────────────────
  /decks/{deckId}/cards:
    get:
      operationId: listCards
      tags: [cards]
      security:
        - bearerAuth: []
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCard
      tags: [cards]
      security:
        - bearerAuth: []
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardRequest"
      responses:
        "201":
          description: Card created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        default:
          $ref: "#/components/responses/Error"

  /cards/{id}:
    put:
      operationId: updateCard
      tags: [cards]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardRequest"
      responses:
        "200":
          description: Card updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCard
      tags: [cards]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Card deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        default:
          $ref: "#/components/responses/Error"

  # ── Review (protected) ─────────────────────────────────────────────
  /review/due:
    get:
      operationId: getDueCards
      tags: [review]
      security:
        - bearerAuth: []
      parameters:
        - name: deck_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Due cards for review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
        default:
          $ref: "#/components/responses/Error"

  /review:
    post:
      operationId: submitReview
      tags: [review]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Review submitted, updated card returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        default:
          $ref: "#/components/responses/Error"

  # ── Sync (protected) ───────────────────────────────────────────────
  /sync:
    post:
      operationId: sync
      tags: [sync]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        default:
          $ref: "#/components/responses/Error"

  # ── Generate (protected) ───────────────────────────────────────────
  /generate:
    post:
      operationId: generateCards
      tags: [generate]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Generated cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedCard"
        default:
          $ref: "#/components/responses/Error"

  # ── Exercises (protected) ──────────────────────────────────────────
  /exercises/due:
    get:
      operationId: getDueExercises
      tags: [exercises]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Due exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseResponse"
        default:
          $ref: "#/components/responses/Error"

  /exercises/generate:
    post:
      operationId: generateExercises
      tags: [exercises]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseGenerateRequest"
      responses:
        "200":
          description: Generated exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseResponse"
        default:
          $ref: "#/components/responses/Error"

  /exercises/grade:
    post:
      operationId: gradeExercise
      tags: [exercises]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseGradeRequest"
      responses:
        "200":
          description: Grade result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeResult"
        default:
          $ref: "#/components/responses/Error"

  /exercises/complete:
    post:
      operationId: completeExercise
      tags: [exercises]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseCompleteRequest"
      responses:
        "200":
          description: Exercise completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Auth ───────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Images ─────────────────────────────────────────────────────
    ImageUploadResponse:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string

    # ── Languages ─────────────────────────────────────────────────
    LanguagePairResponse:
      type: object
      required: [source_lang, target_lang, source_name, target_name]
      properties:
        source_lang:
          type: string
        target_lang:
          type: string
        source_name:
          type: string
        target_name:
          type: string

    # ── Decks ──────────────────────────────────────────────────────
    Deck:
      type: object
      required: [id, user_id, name, source_lang, target_lang, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        source_lang:
          type: string
        target_lang:
          type: string
        created_at:
          type: string
          format: date-time

    CreateDeckRequest:
      type: object
      required: [name, source_lang, target_lang]
      properties:
        name:
          type: string
        source_lang:
          type: string
        target_lang:
          type: string

    # ── Cards ──────────────────────────────────────────────────────
    Card:
      type: object
      required: [id, deck_id, front, back, ease_factor, interval_days, repetitions, next_review, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        deck_id:
          type: string
          format: uuid
        front:
          type: string
        back:
          type: string
        front_image_url:
          type: string
        back_image_url:
          type: string
        ease_factor:
          type: number
          format: double
        interval_days:
          type: integer
        repetitions:
          type: integer
        next_review:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCardRequest:
      type: object
      required: [front, back]
      properties:
        front:
          type: string
        back:
          type: string
        front_image_id:
          type: string
          format: uuid
        back_image_id:
          type: string
          format: uuid

    UpdateCardRequest:
      type: object
      required: [front, back]
      properties:
        front:
          type: string
        back:
          type: string
        front_image_id:
          type: string
          format: uuid
        back_image_id:
          type: string
          format: uuid

    # ── Review ─────────────────────────────────────────────────────
    ReviewRequest:
      type: object
      required: [card_id, grade]
      properties:
        card_id:
          type: string
          format: uuid
        grade:
          type: integer
          minimum: 0
          maximum: 5
        reviewed_at:
          type: string
          format: date-time
        response_time_ms:
          type: integer

    # ── Sync ───────────────────────────────────────────────────────
    SyncRequest:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/SyncAction"

    SyncAction:
      type: object
      required: [card_id, grade]
      properties:
        card_id:
          type: string
          format: uuid
        grade:
          type: integer
          minimum: 0
          maximum: 5
        reviewed_at:
          type: string
          format: date-time
        response_time_ms:
          type: integer

    SyncResult:
      type: object
      required: [processed]
      properties:
        processed:
          type: integer
        errors:
          type: array
          items:
            type: string

    # ── Generate ───────────────────────────────────────────────────
    GenerateRequest:
      type: object
      required: [source_lang, target_lang, deck_id]
      properties:
        prompt:
          type: string
        source_lang:
          type: string
        target_lang:
          type: string
        deck_id:
          type: string
          format: uuid
        generate_images:
          type: boolean
        from_deck:
          type: boolean
        mode:
          type: string
        image_ids:
          type: array
          items:
            type: string
            format: uuid

    GeneratedCard:
      type: object
      required: [front, back]
      properties:
        front:
          type: string
        back:
          type: string
        front_image_base64:
          type: string
        front_image_type:
          type: string

    # ── Exercises ──────────────────────────────────────────────────
    ExerciseCard:
      type: object
      required: [id, front, back, level]
      properties:
        id:
          type: string
        front:
          type: string
        back:
          type: string
        level:
          type: integer

    KnownWord:
      type: object
      required: [front, back]
      properties:
        front:
          type: string
        back:
          type: string

    ExerciseGenerateRequest:
      type: object
      required: [cards, source_lang, target_lang]
      properties:
        session_id:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/ExerciseCard"
        known_words:
          type: array
          items:
            $ref: "#/components/schemas/KnownWord"
        source_lang:
          type: string
        target_lang:
          type: string

    ExerciseResponse:
      type: object
      required: [id, type, level, instruction, prompt, correct_answer, source_card_id]
      properties:
        id:
          type: string
        type:
          type: string
        level:
          type: integer
        instruction:
          type: string
        prompt:
          type: string
        correct_answer:
          type: string
        hint:
          type: string
        source_sentence:
          type: string
        options:
          type: array
          items:
            type: string
        data:
          type: object
          additionalProperties: true
        source_card_id:
          type: string

    ExerciseGradeRequest:
      type: object
      required: [user_answer, correct_answer, source_lang, target_lang]
      properties:
        exercise_id:
          type: string
        exercise_type:
          type: string
        prompt:
          type: string
        correct_answer:
          type: string
        user_answer:
          type: string
        source_lang:
          type: string
        target_lang:
          type: string

    GradeResult:
      type: object
      required: [correct, feedback]
      properties:
        correct:
          type: boolean
        feedback:
          type: string
        corrected_answer:
          type: string

    ExerciseCompleteRequest:
      type: object
      required: [exercise_id, user_answer, correct]
      properties:
        exercise_id:
          type: string
        user_answer:
          type: string
        correct:
          type: boolean

    # ── Common ─────────────────────────────────────────────────────
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
